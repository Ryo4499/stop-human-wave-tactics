[project]
name = "stop-human-wave-tactics-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Ryo Arai", email = "ryo.p4499@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.6",
    "granian>=1.7.0",
    "sqlalchemy>=2.0.36",
    "strawberry-graphql>=0.254.0",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "mypy-extensions>=1.0.0",
    "ruff>=0.8.3",
    "strawberry-graphql[debug-server]>=0.254.0",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
cli = ["rich", "click"]

[tool.hatch.build.targets.wheel]
packages = ["src/stop-human-wave-tactics-backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-sv"]
